# green-weight configuration — single source of truth for all tunable parameters

# ==============================================================================
# Model Configuration (Phase 4)
# ==============================================================================

model:
  # HuggingFace model ID for all three tiers.
  # Must match the base model of the trained QAT adapters (adapters/*/adapter_config.json).
  base_model_id: "meta-llama/Llama-3.2-1B"
  
  # Quantization settings per tier
  quantization:
    4bit:
      enabled: true
      compute_dtype: "float32"
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_use_double_quant: true
      bnb_4bit_compute_dtype: "float32"
    
    8bit:
      enabled: true
      load_in_8bit: true
    
    16bit:
      enabled: true
      dtype: "bfloat16"
  
  # Memory optimization
  lazy_16bit: false  # Set to true if running on 16GB GPU; load 16-bit on demand
  device_map: "auto"
  max_memory_per_gpu: null  # None = auto-detect; or set to (e.g.) {"0": "12GB", "1": "12GB"}
  
  # Generation defaults
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  do_sample: true

# ==============================================================================
# Router Configuration (Phase 3–4 Bridge)
# ==============================================================================

router:
  # Complexity scorer features
  complexity_scorer:
    # Feature ranges for normalization
    # Re-calibrated 2026-08-22 against the real 500-prompt eval set: observed
    # max is 153.75 approx-tokens (old 512 cap made HIGH unreachable by any
    # real prompt). Documentation only — this field isn't read at runtime;
    # the live value is router/complexity_scorer.py's TOKEN_LENGTH_RANGE.
    max_token_length: 154
    max_parse_depth: 8  # calibrated 2026-08-05, see fuzzy_controller breakpoints below (unused directly, kept for documentation consistency)
    spacy_model: "en_core_web_sm"
  
  # Fuzzy controller membership function breakpoints.
  # Each list is [lo, hi] — the LOW/MEDIUM edge and the MEDIUM/HIGH edge.
  # fuzzy_controller.py's _trimf_low_mid_high() builds a symmetric
  # LOW/MEDIUM/HIGH triangular partition from just these two: MEDIUM's
  # peak is auto-computed as their midpoint, there is no separate 3rd
  # breakpoint. (Found 2026-08-22: these lists used to carry a 3rd
  # "HIGH transition" value that _trimf_low_mid_high never read — it was
  # silently inert since the function was written. Considered switching to
  # a true 3-breakpoint asymmetric partition instead, but that's a bigger
  # behavior change — e.g. flesch_kincaid's old 3rd value (18) sits exactly
  # on FLESCH_KINCAID_RANGE's ceiling and would need re-tuning to avoid a
  # new zero-width degenerate membership triangle, same class of bug just
  # fixed for entropy below — so deferred; dropped the dead value instead
  # to match actual behavior.)
  fuzzy_controller:
    # Flesch-Kincaid readability grade (0–18 scale, normalized to 0–1)
    flesch_kincaid_breakpoints: [6, 12]  # LOW/MEDIUM, MEDIUM/HIGH edges

    # Token length (normalized to 0–1 where 1 = 154 tokens, see
    # max_token_length comment above)
    token_length_breakpoints: [0.2, 0.5]  # LOW/MEDIUM, MEDIUM/HIGH edges

    # Shannon entropy (0–1 scale). Re-calibrated 2026-08-22 against the
    # full 500-prompt eval set (observed range 3.37-4.66 bits, matching
    # complexity_scorer.py's ENTROPY_RANGE=(3.3, 5.0)). The prior
    # [3.3, 3.7, 4.1] breakpoints were a real bug, not just stale: bps[0]
    # (3.3) exactly equals ENTROPY_RANGE's floor, so
    # normalize_to_01(3.3, 3.3, 5.0) = 0, collapsing the "low" membership
    # triangle to zero width (fuzz.trimf([0,0,0])) — effectively dead.
    # Per-difficulty analysis also shows entropy barely discriminates
    # prompt difficulty in this dataset (easy mean=4.11, medium=3.96,
    # hard=4.11 bits) — that weak-signal finding is a candidate for the
    # Phase 5c feature-ablation study, not something this breakpoint fix
    # resolves; this change only fixes the degenerate-membership bug.
    entropy_breakpoints: [3.8, 4.1]  # LOW/MEDIUM, MEDIUM/HIGH edges (bits)

    # Syntax parse depth (0–1 scale). Re-calibrated 2026-08-22 against the
    # full 500-prompt eval set (observed range 2-12, matching
    # complexity_scorer.py's SYNTAX_DEPTH_RANGE=(2, 14)). The prior
    # [3, 4, 6] breakpoints, left unchanged after that range widened from
    # (1, 8), normalized to lo=0.083/hi=0.167 — compressed into the bottom
    # ~17% of the [0,1] space, so nearly all real prompts (easy mean=4.42,
    # medium mean=4.46, hard mean=5.57) would land in the "high" bucket
    # regardless of actual difficulty. Unlike entropy, this feature does
    # show real separation by difficulty, so getting the breakpoints right
    # matters for the routing signal, not just correctness.
    syntax_depth_breakpoints: [4, 5]  # LOW/MEDIUM, MEDIUM/HIGH edges
    
    # Code/math detection is binary, not fuzzy
    
    # Tier assignment from defuzzified complexity output (0–100)
    tier_thresholds:
      4bit_upper: 33    # complexity <= 33 → 4-bit
      8bit_upper: 66    # 33 < complexity <= 66 → 8-bit
      16bit_lower: 67   # complexity > 66 → 16-bit
  
  # RouteLLM router configuration
  routellm:
    router_type: "mf"  # Options: "mf" (matrix factorization), "bert", "sw_ranking"
    # "mf" is recommended by RouteLLM paper as best-performing
    mf_checkpoint: "routellm/mf_gpt4_augmented"
    # Models are mapped: "16bit" → strong, "4bit" → weak, "8bit" → bypass
    # When fuzzy output is in MID zone (0.33–0.66), skip RouteLLM and use 8-bit directly

# ==============================================================================
# Cascade Configuration (Phase 4)
# ==============================================================================

cascade:
  # FrugalGPT cascade order (attempted in this sequence on escalation)
  service_order:
    - local/4bit
    - local/8bit
    - local/16bit
  
  # Generation judger fine-tuning
  judger:
    # Pre-trained DistilBERT from FrugalGPT; fine-tune on OpenOrca subset
    base_model: "distilbert-base-uncased"
    
    # Fine-tuning dataset (OpenOrca subset)
    finetune_dataset_path: "data/openorca_finetune_500.csv"
    train_test_split: 0.8  # 80% train, 20% test
    
    # Threshold for stop-judger (when judger score < threshold, escalate)
    # This is the key lever for energy-accuracy tradeoff
    # Will be optimized by cascade optimizer given energy budget
    threshold: 0.5  # Placeholder; override with optimize_cascade_threshold()
    
    # Fine-tuning hyperparameters
    learning_rate: 2e-5
    num_epochs: 3
    batch_size: 16
    device: "cuda"

# ==============================================================================
# Benchmarking Configuration (Phase 5)
# ==============================================================================

benchmark:
  # Energy tracking
  energy_tracker:
    # CodeCarbon configuration
    country_code: "USA"  # ISO 3166-1 alpha-3 code
    output_dir: "results/energy_logs"
    save_interval: 100  # Save after every N prompts
  
  # Accuracy evaluation
  accuracy_eval:
    # lm-eval-harness benchmark tasks
    tasks: ["mmlu", "hellaswag"]  # Add more as needed
    num_fewshot: 0
    output_dir: "results/accuracy_logs"
    
    # RouteLLM evaluation metrics (computed automatically)
    # CPT (call-performance threshold), APGR (average performance gap recovered)
    compute_metrics: true
  
  # Evaluation dataset
  eval_dataset:
    path: "data/eval_prompts.jsonl"
    size: 500
    difficulty_split:
      easy: 200      # Simple factual questions
      medium: 150    # Summarization / explanation
      hard: 150      # Reasoning / math / code
  
  # Output visualization
  tradeoff_plotter:
    output_dir: "results/figures"
    dpi: 300
    plot_formats: ["png", "pdf"]

# ==============================================================================
# Pipeline Configuration
# ==============================================================================

pipeline:
  # Dry-run mode: process only first N prompts
  dry_run: false
  dry_run_prompts: 10
  
  # Logging
  log_output_dir: "results/pipeline_logs"
  log_level: "INFO"
  
  # Model pool warmup
  warmup_enabled: true
  warmup_prompts: 5

# ==============================================================================
# Hardware / System
# ==============================================================================

hardware:
  gpu_device: 0  # GPU index if multiple GPUs available
  cpu_threads: 4
  seed: 42  # For reproducibility
