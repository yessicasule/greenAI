openapi: 3.0.3
info:
  title: Green-Weight API
  version: "0.1.0"
  description: >
    Contract for major-project/backend/src/green_weight/api.py, verified
    against the frontend's real client at
    major-project/frontend/src/lib/api.js. backend-agent must update this
    file in the same turn as any route/schema change in api.py;
    frontend-agent must flag (not silently patch around) any mismatch it
    finds between this file and actual backend behavior.
servers:
  # The backend itself.
  - url: http://localhost:8000
    description: FastAPI backend (uvicorn api:app --port 8000)
  # How the dashboard actually reaches it. src/lib/api.js sends every
  # request to the relative '/api' prefix, which Vite proxies to the
  # backend with the prefix stripped (vite.config.js, applied to both
  # `npm run dev` on :5173 and `npm run preview` on :4173). So GET
  # /api/health at the dashboard's origin == GET /health here. Keeping
  # requests same-origin means the dashboard does not depend on api.py's
  # CORS allow-list. Set VITE_API_BASE to bypass the proxy and call the
  # backend directly (see frontend/.env.example).
  - url: http://localhost:5173/api
    description: Vite dev-server proxy to the same backend

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  routing_layer: { type: string, example: ready }
                  gpu_ready: { type: boolean }

  /route:
    post:
      summary: Routing-only — no GPU needed, energy_joules always 0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InferRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteResponse" }
        "500":
          description: Routing error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /infer:
    post:
      summary: >
        Full inference. With routing_only=true behaves like /route. With
        routing_only=false: uses the real model pool if loaded, otherwise
        falls back to a keyword/math mock response (RouteResponse.is_mock
        will be true; the mock's energy_joules values are fixed placeholders
        {4bit: 8.5, 8bit: 28.5, 16bit: 105.2} baked into api.py, NOT
        measurements — never surface these as real numbers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InferRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteResponse" }
        "500":
          description: Inference error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /results:
    get:
      summary: All entries from pipeline_trace.jsonl (routing/inference history)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { type: object }

  /energy:
    get:
      summary: energy_summary.csv as JSON rows (empty until Session 1 lands real data)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items: { type: object }

  /accuracy:
    get:
      summary: accuracy_results.json verbatim (currently `{}` — no Session 2 data yet)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object }

  # ── Evidence endpoints ──────────────────────────────────────────────
  # Read-only. Serve the project's committed measurement artifacts to the
  # dashboard's Analytics page. EVERY response carries `provenance`, and
  # the frontend MUST render it: a number's trustworthiness is decided by
  # the backend, not the UI. See backend/src/green_weight/evidence.py.
  #
  #   VERIFIED   verify_results.py PASS - safe to present as a result
  #   CONTENDED  real measurement under host contention; not gate-eligible
  #   DERIVED    computed from committed inputs, not a GPU measurement
  #   PENDING    session has not produced data yet - never fabricate

  /evidence/validation:
    get:
      summary: verify_results.py verdict, counts and every PASS/WARN/FAIL finding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provenance: { type: string, example: VERIFIED }
                  verdict: { type: string, nullable: true, example: "NOT PUBLISHABLE - failures present" }
                  generated_at: { type: string, nullable: true }
                  counts:
                    type: object
                    properties:
                      PASS: { type: integer }
                      WARN: { type: integer }
                      FAIL: { type: integer }
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        level: { type: string, enum: [PASS, WARN, FAIL] }
                        area: { type: string }
                        finding: { type: string }

  /evidence/experiments:
    get:
      summary: The append-only experiment log from paper/results.md
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provenance: { type: string }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        session: { type: string }
                        script: { type: string }
                        outputs: { type: string }
                        verdict: { type: string, example: PASS }
                        finding: { type: string }

  /evidence/energy:
    get:
      summary: >
        Session 1 per-tier J/token - the project's one VERIFIED
        quantitative result. `ratio_vs_16bit` is arithmetic on two measured
        means; it is the cost of running a static tier, NOT an energy
        saving achieved by routing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provenance: { type: string, example: VERIFIED }
                  session: { type: string }
                  hardware: { type: string }
                  method: { type: string }
                  caveat: { type: string }
                  tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        tier: { type: string, example: 4bit }
                        n: { type: number }
                        mean_j_per_token: { type: number }
                        std: { type: number }
                        ci95: { type: number }
                        ratio_vs_16bit: { type: number }

  /evidence/routing:
    get:
      summary: >
        Session 4 routing conditions, both runs. provenance is CONTENDED -
        measured under host contention, not gate-eligible, and predating
        the 2026-09-09 router fixes. The `accuracy` column is a coarse
        reference-match proxy (0.11-0.26), NOT lm-eval accuracy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provenance: { type: string, example: CONTENDED }
                  caveat: { type: string }
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        run: { type: string }
                        source: { type: string }
                        contention_detail: { type: string }
                        conditions:
                          type: array
                          items: { type: object }

  /evidence/router-quality:
    get:
      summary: >
        Routing-decision precision/recall/F1 per tier, from
        training/scripts/router_quality_report.py. provenance DERIVED.
        Reference labels are dataset provenance, not measured quantization
        sensitivity - this describes the routing DECISION, not model
        accuracy and not energy.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  provenance: { type: string, example: DERIVED }
                  caveat: { type: string }
                  n_prompts: { type: integer }
                  overall:
                    type: object
                    properties:
                      exact_agreement: { type: number }
                      macro_precision: { type: number }
                      macro_recall: { type: number }
                      macro_f1: { type: number }
                      spearman_rho: { type: number }
                  per_tier:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        precision: { type: number }
                        recall: { type: number }
                        f1: { type: number }
                        support: { type: integer }
                  tier_mix: { type: object }
                  confusion: { type: object }
                  complexity_by_difficulty: { type: object }


components:
  schemas:
    InferRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        routing_only: { type: boolean, default: false }
        max_new_tokens: { type: integer, default: 256 }

    RouteResponse:
      type: object
      properties:
        prompt: { type: string }
        features: { type: object }
        fuzzy_tier: { type: string, example: "8bit" }
        win_probability:
          type: number
          description: >
            Despite the name, this is complexity_score/100 from the fuzzy
            controller, not a RouteLLM classifier output. RouteLLM's
            pretrained checkpoints can't be applied to our quantization
            tiers (see router/routellm_bridge.py) — a real tier-preference
            router is planned post-Session-4.
        final_tier: { type: string, example: "8bit" }
        energy_joules: { type: number }
        duration_s: { type: number }
        response: { type: string, nullable: true }
        is_mock: { type: boolean, default: false }
        cost_usd: { type: number }
        latency_ms: { type: number }

    ErrorResponse:
      type: object
      properties:
        detail: { type: string }
